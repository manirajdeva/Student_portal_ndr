<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>NDR EdTech — Interview Slot Booking Portal — Sign In</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="ndr_logo.png">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#10172a">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body data-page="login">
  <div id="toast-container"></div>

  <div class="login-wrap">
    <div class="login-card">
      <div class="brand-logo"><img src="ndr_logo.png" alt="NDR EdTech"></div>
      <p class="badge">INTERVIEW SLOT BOOKING PORTAL</p>

      <div class="role-toggle" id="role-toggle">
        <button type="button" class="role-toggle-btn active" data-role="Student">Student</button>
        <button type="button" class="role-toggle-btn" data-role="Admin">Admin</button>
      </div>

      <h2 id="login-heading">Student Sign In</h2>
      <p class="sub" id="login-subtext">Sign in to view and book your interview slots.</p>

      <form id="login-form">
        <div class="field">
          <label>Username</label>
          <input id="login-username" type="text" autocomplete="username" required>
        </div>
        <div class="field">
          <label>Password</label>
          <div class="password-wrap">
            <input id="login-password" type="password" autocomplete="current-password" required>
            <button type="button" class="toggle-password" aria-label="Show password">👁</button>
          </div>
        </div>
        <div class="error-msg" id="login-error"></div>
        <button type="submit" class="btn btn-primary btn-block" id="login-btn">Sign In</button>
      </form>
    </div>

    <footer class="contact-footer contact-footer-standalone">
      <p class="contact-footer-title">Contact us</p>
      <a class="contact-link" href="https://www.instagram.com/ndr_edtech/" target="_blank" rel="noopener">
        <span class="contact-icon instagram"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1" fill="currentColor" stroke="none"/></svg></span>
        Instagram
      </a>
      <a class="contact-link" href="https://wa.me/918722355666" target="_blank" rel="noopener">
        <span class="contact-icon whatsapp"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a10 10 0 00-8.5 15.2L2 22l4.9-1.5A10 10 0 1012 2zm5.6 14.3c-.2.6-1.2 1.2-1.7 1.3-.4.1-1 .1-1.6-.1-.4-.1-.9-.3-1.5-.6-2.7-1.2-4.4-3.9-4.6-4.1-.1-.2-1.1-1.5-1.1-2.8 0-1.3.7-2 1-2.2.2-.2.5-.3.7-.3h.5c.2 0 .4 0 .6.4.2.5.7 1.7.8 1.8.1.1.1.3 0 .5-.1.2-.1.3-.3.5l-.4.5c-.1.1-.3.3-.1.6.2.3.8 1.3 1.7 2.1 1.2 1 2.1 1.4 2.5 1.6.3.1.5.1.6-.1l.6-.7c.2-.3.4-.2.6-.1l1.6.8c.2.1.3.1.4.2.1.1.1.6-.1 1.2z"/></svg></span>
        WhatsApp
      </a>
      <a class="contact-link" href="mailto:ndredtech@gmail.com">
        <span class="contact-icon email"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></svg></span>
        Email
      </a>
    </footer>
  </div>

  <script src="script.js"></script>
</body>
</html>
